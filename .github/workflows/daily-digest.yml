name: Daily Digest Pipeline

on:
  schedule:
    # 7:00 AM en Quintana Roo / Cancún / Playa del Carmen (UTC-5) -> 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

# Permisos generales
permissions:
  contents: read

jobs:
  build:
    name: Build Digest & Persist Cache
    runs-on: ubuntu-latest
    permissions:
      contents: write # Para commit y push de archive/ y cache/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Daily Digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
        run: |
          python main.py

      - name: Persist archive and summaries cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/archive/ cache/
          if git diff --staged --quiet; then
            echo "No hay cambios en el archivo histórico ni en la caché."
          else
            git commit -m "chore: persist archive and cache [skip ci]"
            git push
            echo "Cambios en archivo histórico y caché guardados en el repositorio."
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Send ntfy Push Notification
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch Notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: ${{ secrets.SITE_URL || needs.deploy.outputs.page_url }}
        run: |
          python notify.py
